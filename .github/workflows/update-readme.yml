name: Auto Update README Progress

on:
  push:
    branches: [ main ]

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Recount Solutions & Update README and Index
        run: |
          python scripts/update_readme.py
          python scripts/generate_index.py

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md SOLUTIONS_INDEX.md
          git diff --staged --quiet || (git commit -m "docs: auto-update progress table and solutions index [skip ci]" && git push)
